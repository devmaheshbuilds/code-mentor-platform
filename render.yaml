# Code Mentor — Render Blueprint
# Dashboard: New > Blueprint > connect this repo > apply
# Set secret env vars in the Render dashboard after first deploy.

services:
  - type: web
    name: code-mentor-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_API_HOST
        value: judge0-ce.p.rapidapi.com
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: code-mentor-ai
          envVarKey: RENDER_EXTERNAL_URL
      # Optional: set to your Render frontend URL for strict CORS (comma-separated)
      - key: CLIENT_URL
        sync: false

  - type: web
    name: code-mentor-ai
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: web
    name: code-mentor-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: code-mentor-api
          envVarKey: RENDER_EXTERNAL_URL
