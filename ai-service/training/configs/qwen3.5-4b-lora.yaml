model_path: models/Qwen3.5-4B-Base
dataset_path: training/dataset/python_teaching_full.jsonl
prepared_path: training/dataset/python_teaching_prepared.jsonl
output_path: training/outputs/qwen3.5-4b-coding-teacher

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  max_length: 1024
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 5
  save_strategy: epoch
  eval_ratio: 0.05
  seed: 42
  bf16: true
  fp16: false

generation:
  max_new_tokens: 150
  temperature: 0.3
  do_sample: false
